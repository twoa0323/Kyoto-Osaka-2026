<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Kyoto & Osaka Smart Planner AI</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --brand-red: #8D2B2B; --bg-creme: #EBE7DE; --text-dark: #1F1F1F; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-creme); color: var(--text-dark); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .serif { font-family: 'Noto Serif TC', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-dot::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background-color: var(--brand-red); border-radius: 50%; }
        .glass { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2); }
        .glass-dark { background: rgba(30, 30, 30, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .highlight-card { border: 1px solid transparent; background: linear-gradient(white, white) padding-box, linear-gradient(to right, #D4AF37, #F9E29C) border-box; box-shadow: 0 4px 20px rgba(141, 43, 43, 0.08); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* AI 思考中的打字效果 */
        .typing::after { content: '...'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ICON_MAP = { 'FLIGHT': 'plane', 'TRANSPORT': 'train', 'HOTEL': 'home', 'FOOD': 'utensils', 'SIGHTSEEING': 'camera', 'HIGHLIGHT': 'star', 'INFO': 'info' };
        
        // 🔑 請在此輸入您的 Google AI Studio API Key
        const API_KEY = "AIzaSyD6TgKpI5XnxN-eSc3attMHHw-7B8-OCMk";

        const INITIAL_PLAN = [
            { id: 1, date: '25', day: 'SAT', title: '抵達京都與鴨川', city: 'Kyoto', defaultImg: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1000', customImg: null, items: [{ id: 101, time: '13:25', title: '出發 (JX846)', desc: '星宇航空 TPE 直飛 KIX', type: 'FLIGHT', location: '關西國際機場', highlight: false, btnLabel: '官方網站', link: 'https://www.starlux-airlines.com' }, { id: 102, time: '16:00', title: '錦市場巡禮', desc: '品嚐豆乳甜甜圈與三木雞卵', type: 'FOOD', location: '錦市場', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 2, date: '26', day: 'SUN', title: '嵐山新綠', city: 'Arashiyama', defaultImg: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?q=80&w=1000', customImg: null, items: [{ id: 201, time: '09:30', title: '嵐山竹林之道', desc: '漫步綠意之道', type: 'SIGHTSEEING', location: '嵐山', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 3, date: '27', day: 'MON', title: '任天堂博物館', city: 'Uji', defaultImg: 'https://images.unsplash.com/photo-1601362840469-51e4d8d59085?q=80&w=1000', customImg: null, items: [{ id: 301, time: '11:00', title: '任天堂博物館', desc: 'Nintendo Museum (預約制)', type: 'HIGHLIGHT', location: 'Nintendo Museum', highlight: true, btnLabel: '官方網站', link: 'https://museum.nintendo.com' }] },
            { id: 4, date: '28', day: 'TUE', title: '清水舞台參拜', city: 'Kyoto', defaultImg: 'https://images.unsplash.com/photo-1528164344705-47542687990d?q=80&w=1000', customImg: null, items: [{ id: 401, time: '08:30', title: '清水寺', desc: '音羽瀑布與產寧坂', type: 'SIGHTSEEING', location: '清水寺', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 5, date: '29', day: 'WED', title: '大阪古今巡禮', city: 'Osaka', defaultImg: 'https://images.unsplash.com/photo-1590253504396-72449038bc4a?q=80&w=1000', customImg: null, items: [{ id: 501, time: '10:00', title: '大阪城公園', desc: '登上天守閣俯瞰市景', type: 'SIGHTSEEING', location: '大阪城', highlight: false, btnLabel: '官方網站', link: '' }] },
            { id: 6, date: '30', day: 'THU', title: '環球影城 USJ', city: 'USJ', defaultImg: 'https://images.unsplash.com/photo-1616422285623-13ff0167c95c?q=80&w=1000', customImg: null, items: [{ id: 601, time: '08:30', title: 'USJ 入園冒險', desc: '瑪利歐與哈利波特全日遊', type: 'HIGHLIGHT', location: '日本環球影城', highlight: true, btnLabel: '官方網站', link: '' }] },
            { id: 7, date: '01', day: 'FRI', title: '勝尾寺祈福', city: 'Minoo', defaultImg: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=1000', customImg: null, items: [{ id: 701, time: '11:00', title: '勝尾寺', desc: '祈求勝運的達摩之寺', type: 'SIGHTSEEING', location: '勝尾寺', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 8, date: '02', day: 'SAT', title: '返程台北', city: 'Airport', defaultImg: 'https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000', customImg: null, items: [{ id: 801, time: '13:25', title: '回程起飛', desc: '結束愉快 8 天行程', type: 'FLIGHT', location: '關西機場', highlight: false, btnLabel: '資訊', link: '' }] }
        ];

        const App = () => {
            const load = (k, i) => { const s = localStorage.getItem(k); return s ? JSON.parse(s) : i; };
            const [days, setDays] = useState(() => load('travel_days_v11', INITIAL_PLAN));
            const [view, setView] = useState('plan');
            const [selectedIdx, setSelectedIdx] = useState(0);
            const [gpsOn, setGpsOn] = useState(false);
            const [isEditMode, setIsEditMode] = useState(false);
            
            // AI 相關狀態
            const [aiOpen, setAiOpen] = useState(false);
            const [aiInput, setAiInput] = useState("");
            const [aiChat, setAiChat] = useState([]);
            const [isAiThinking, setIsAiThinking] = useState(false);

            useEffect(() => {
                localStorage.setItem('travel_days_v11', JSON.stringify(days));
                if (window.lucide) lucide.createIcons();
            }, [days, view, selectedIdx, aiOpen]);

            const currentDay = days[selectedIdx] || days[0];
            const firstItem = currentDay?.items?.[0] || { title: '目的地' };

            // 🤖 Gemini API 調用邏輯
            const handleAiConsult = async () => {
                if (!aiInput.trim() || isAiThinking) return;
                
                const userMsg = { role: "user", content: aiInput };
                setAiChat(prev => [...prev, userMsg]);
                setAiInput("");
                setIsAiThinking(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `你是一位日本旅遊專家。現在是行程第 ${selectedIdx + 1} 天，計畫是「${currentDay.title}」。使用者問：${aiInput}`
                                }]
                            }]
                        })
                    });

                    const data = await response.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    setAiChat(prev => [...prev, { role: "ai", content: aiText }]);
                } catch (error) {
                    setAiChat(prev => [...prev, { role: "ai", content: "抱歉，連線發生錯誤。請確保 API Key 已正確填寫。" }]);
                } finally {
                    setIsAiThinking(false);
                }
            };

            const toggleGps = useCallback(() => {
                setGpsOn(prev => !prev);
            }, []);

            return (
                <div className="max-w-md mx-auto min-h-screen relative lg:shadow-2xl">
                    
                    {/* FIXED HEADER */}
                    <header className="fixed top-0 left-0 right-0 max-w-md mx-auto z-50 bg-[#EBE7DE] pt-8 px-6 pb-2 border-b border-stone-300">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="serif text-xl font-bold tracking-tight text-stone-900">Kyoto ● Osaka</h1>
                            <button 
                                onClick={() => setAiOpen(true)}
                                className="flex items-center gap-1.5 bg-stone-900 text-white px-3.5 py-1.5 rounded-full text-[10px] font-bold shadow-lg active:scale-95 transition-transform"
                            >
                                <i data-lucide="sparkles" className="w-3.5 h-3.5"></i> AI 靈感
                            </button>
                        </div>

                        <div className="flex overflow-x-auto hide-scrollbar gap-8 pt-3 pb-1">
                            {days.map((d, i) => (
                                <div key={d.id} onClick={() => setSelectedIdx(i)} className={`relative flex flex-col items-center min-w-[32px] cursor-pointer transition-all ${selectedIdx === i ? 'text-black font-bold active-dot' : 'text-stone-400'}`}>
                                    <span className="text-[10px] mb-0.5">{d.day}</span>
                                    <span className="serif text-xl leading-none">{d.date}</span>
                                </div>
                            ))}
                        </div>
                    </header>

                    {/* CONTENT */}
                    <div className="pt-44 px-6 pb-44">
                        <div className="animate-fade">
                            <h2 className="serif text-xl font-bold text-stone-900 mb-6">{currentDay.title}</h2>
                            <div className="relative h-56 rounded-[32px] overflow-hidden shadow-xl mb-12">
                                <img src={currentDay.defaultImg} className="w-full h-full object-cover" />
                                <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                                <div className="absolute bottom-6 left-7 right-7">
                                    <span className="glass-dark px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest">Day {selectedIdx + 1}</span>
                                    <h2 className="serif text-2xl text-white font-bold leading-tight mt-1">{currentDay.city}</h2>
                                </div>
                            </div>

                            <div className="space-y-10 relative before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[0.5px] before:bg-stone-300">
                                {currentDay.items.map((item) => (
                                    <div key={item.id} className="flex gap-6 items-start">
                                        <div className="relative z-10 w-6 h-6 rounded-full border border-stone-200 bg-white flex items-center justify-center text-stone-500">
                                            <i data-lucide={ICON_MAP[item.type] || 'map-pin'} className="w-3.5 h-3.5"></i>
                                        </div>
                                        <div className="flex-1">
                                            <span className="text-[11px] font-bold text-stone-500 tracking-tighter">{item.time}</span>
                                            <h3 className="serif text-base font-bold tracking-tight text-stone-900">{item.title}</h3>
                                            <p className="text-xs text-stone-600 mt-1">{item.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* STATUS BAR - 使用 Key 修復當機 */}
                    {view === 'plan' && (
                        <div key={`gps-ui-${gpsOn}`} className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass rounded-[32px] p-3.5 border border-white/60 shadow-2xl flex items-center justify-between z-40 bg-white/80">
                            <div className="flex items-center gap-4 flex-1">
                                <div onClick={toggleGps} className="flex flex-col items-center gap-0.5 border-r border-stone-200 pr-4 cursor-pointer">
                                    <div className={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${gpsOn ? 'bg-red-50 text-red-600 animate-pulse' : 'bg-stone-100 text-stone-400'}`}>
                                        <i data-lucide={gpsOn ? 'target' : 'map-pin-off'} className="w-4 h-4"></i>
                                    </div>
                                    <span className={`text-[7px] font-bold uppercase mt-1 ${gpsOn ? 'text-red-700' : 'text-stone-400'}`}>GPS {gpsOn ? 'ON' : 'OFF'}</span>
                                </div>
                                <div className="flex-1">
                                    <p className="serif text-base font-bold text-stone-800">{gpsOn ? '追蹤中' : '準備就緒'}</p>
                                    <p className="text-[9px] text-stone-500 font-bold truncate">→ {firstItem.title}</p>
                                </div>
                            </div>
                            <div className="bg-[#F2EDE4] rounded-2xl px-5 py-3 text-right border border-stone-300 min-w-[85px] shadow-inner">
                                <span className="text-[12px] font-bold text-stone-800">2026</span>
                            </div>
                        </div>
                    )}

                    {/* AI ASSISTANT MODAL */}
                    {aiOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade">
                            <div className="bg-white w-full max-w-sm rounded-[40px] overflow-hidden shadow-2xl flex flex-col max-h-[80vh] relative">
                                <button onClick={() => setAiOpen(false)} className="absolute top-6 right-6 p-2 bg-stone-100 rounded-full z-50">
                                    <i data-lucide="x" className="w-4 h-4 text-stone-500"></i>
                                </button>
                                
                                <div className="p-8 border-b border-stone-100">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-stone-900 rounded-full flex items-center justify-center text-white shadow-lg">
                                            <i data-lucide="sparkles" className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 className="serif text-xl font-bold text-stone-800">Gemini 旅遊專家</h3>
                                            <p className="text-[10px] text-stone-400 uppercase font-bold">Powered by Google AI</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-8 space-y-6 hide-scrollbar">
                                    {aiChat.length === 0 && (
                                        <p className="text-sm text-stone-400 italic text-center py-10">詢問有關今天行程的建議吧！<br/>例如：「附近有推薦的美食嗎？」</p>
                                    )}
                                    {aiChat.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] p-4 rounded-[24px] text-sm ${msg.role === 'user' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-800'}`}>
                                                {msg.content}
                                            </div>
                                        </div>
                                    ))}
                                    {isAiThinking && (
                                        <div className="flex justify-start">
                                            <div className="bg-stone-100 p-4 rounded-[24px] text-sm text-stone-400 typing font-bold">AI 正在思考</div>
                                        </div>
                                    )}
                                </div>

                                <div className="p-8 bg-stone-50 border-t border-stone-100">
                                    <div className="flex gap-2">
                                        <input 
                                            value={aiInput}
                                            onChange={(e) => setAiInput(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleAiConsult()}
                                            placeholder="輸入旅遊問題..."
                                            className="flex-1 bg-white border border-stone-200 p-4 rounded-[20px] text-sm outline-none focus:ring-2 ring-stone-900 transition-all"
                                        />
                                        <button 
                                            onClick={handleAiConsult}
                                            disabled={isAiThinking}
                                            className="w-12 h-12 bg-stone-900 text-white rounded-[18px] flex items-center justify-center shadow-lg disabled:bg-stone-300"
                                        >
                                            <i data-lucide="send-horizontal" className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
