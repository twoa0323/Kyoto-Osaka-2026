<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Kyoto & Osaka Planner</title>
    
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --brand-red: #8D2B2B; --bg-creme: #FAF9F6; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-creme); color: #333; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .serif { font-family: 'Noto Serif TC', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 選中日期下的紅點 */
        .active-dot::after {
            content: ''; position: absolute; bottom: -6px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background-color: var(--brand-red); border-radius: 50%;
        }

        .glass { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        .divider { height: 1px; background-color: #EFEBE4; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const TRAVEL_DATA = [
            { id: 1, date: '25', day: 'SAT', title: '鴨川散策與京都首夜', city: '京都市', img: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1000', items: [
                { id: 101, time: '13:25', title: '出發 (JX846)', desc: '星宇航空 TPE 直飛 KIX', type: 'FLIGHT' },
                { id: 102, time: '16:00', title: '錦市場巡禮', desc: '品嚐豆乳甜甜圈與三木雞卵', type: 'FOOD' },
                { id: 103, time: '17:30', title: '鴨川步道', desc: '欣賞週末傍晚的河岸風光', type: 'SIGHT' }
            ]},
            { id: 2, date: '26', day: 'SUN', title: '嵐山新綠與金閣寺', city: '嵐山', img: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?q=80&w=1000', items: [
                { id: 201, time: '09:30', title: '嵐山竹林之道', desc: '天龍寺與曹源池庭園', type: 'SIGHT' },
                { id: 202, time: '15:30', title: '金閣寺 (鹿苑寺)', desc: '午後陽光映照金箔最美時刻', type: 'SIGHT' }
            ]},
            { id: 3, date: '27', day: 'MON', title: '任天堂博物館與宇治', city: '宇治市', img: 'https://images.unsplash.com/photo-1601362840469-51e4d8d59085?q=80&w=1000', items: [
                { id: 301, time: '11:00', title: '任天堂博物館', desc: 'Nintendo Museum (預約制)', type: 'SIGHT', highlight: true },
                { id: 302, time: '15:00', title: '宇治平等院', desc: '抹茶巡禮與紫藤花', type: 'SIGHT' }
            ]},
            { id: 4, date: '28', day: 'TUE', title: '清水舞台與移動至大阪', city: '大阪市', img: 'https://images.unsplash.com/photo-1528164344705-47542687990d?q=80&w=1000', items: [
                { id: 401, time: '08:30', title: '清水寺參拜', desc: '清水舞台、音羽瀑布', type: 'SIGHT' },
                { id: 402, time: '17:00', title: '道頓堀巡禮', desc: '與跑跑人看板合照', type: 'SIGHT' }
            ]},
            { id: 5, date: '29', day: 'WED', title: '大阪古今巡禮 (昭和日)', city: '大阪市', img: 'https://images.unsplash.com/photo-1590253504396-72449038bc4a?q=80&w=1000', items: [
                { id: 501, time: '09:30', title: '大阪城天守閣', desc: '登頂俯瞰市景', type: 'SIGHT' },
                { id: 502, time: '17:30', title: '阿倍野展望台', desc: '看關西壯觀夜景', type: 'SIGHT' }
            ]},
            { id: 6, date: '30', day: 'THU', title: 'USJ 全日冒險', city: '環球城', img: 'https://images.unsplash.com/photo-1616422285623-13ff0167c95c?q=80&w=1000', items: [
                { id: 601, time: '08:30', title: '環球影城入園', desc: '任天堂世界與哈利波特', type: 'SIGHT', highlight: true }
            ]},
            { id: 7, date: '01', day: 'FRI', title: '勝尾寺祈福與梅田', city: '大阪市', img: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=1000', items: [
                { id: 701, time: '11:30', title: '勝尾寺參拜', desc: '祈求勝運的達摩之寺', type: 'SIGHT' },
                { id: 702, time: '15:30', title: '梅田最後購物', desc: '百貨公司採買', type: 'SIGHT' }
            ]},
            { id: 8, date: '02', day: 'SAT', title: '返程台北', city: '關西機場', img: 'https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000', items: [
                { id: 801, time: '13:25', title: '回程起飛', desc: '結束 8 天美好假期', type: 'FLIGHT' }
            ]}
        ];

        const App = () => {
            const [selectedIdx, setSelectedIdx] = useState(0);
            const [view, setView] = useState('plan'); // plan, wallet, info
            const [gpsOn, setGpsOn] = useState(false);
            const [isMoving, setIsMoving] = useState(false);
            const [detailItem, setDetailItem] = useState(null);
            const [expenses, setExpenses] = useState([{ id: 1, name: '預估零用金', amount: 50000, currency: 'JPY' }]);

            useEffect(() => lucide.createIcons(), [selectedIdx, view, gpsOn, isMoving, detailItem]);

            const currentDay = TRAVEL_DATA[selectedIdx];
            const exchangeRate = 0.22;
            const totalTWD = expenses.reduce((acc, curr) => acc + (curr.currency === 'JPY' ? curr.amount * exchangeRate : curr.amount), 0);

            return (
                <div className="max-w-md mx-auto min-h-screen relative bg-white lg:shadow-2xl">
                    
                    {/* FIXED HEADER (參考圖 IMG_5967 比例) */}
                    <header className="fixed top-0 left-0 right-0 max-w-md mx-auto z-50 bg-[#FAF9F6] pt-8 px-6 pb-2 border-b border-gray-100 lg:max-w-xl">
                        <p className="text-[10px] tracking-[0.4em] text-[#C4C0B8] uppercase font-bold text-center mb-1">Japan Trip</p>
                        <div className="flex justify-center items-center gap-1.5 mb-8">
                            <h1 className="serif text-xl font-bold tracking-tight text-[#444]">Kyoto & Osaka</h1>
                            <span className="text-[10px] border border-gray-300 rounded-full px-2 py-0.5 text-gray-400 italic">2026</span>
                        </div>
                        
                        <div className="flex items-center">
                            <div className="absolute top-[82px] left-6">
                                <span className="text-[9px] tracking-widest text-[#C4C0B8] font-bold uppercase">Apr 25 - May 2</span>
                            </div>

                            {/* 日期滑動列 (完整 8 天) */}
                            <div className="flex-1 overflow-x-auto hide-scrollbar flex gap-8 pt-5 pb-1">
                                {TRAVEL_DATA.map((d, i) => (
                                    <div key={d.id} onClick={() => { setSelectedIdx(i); setView('plan'); }} className={`relative flex flex-col items-center min-w-[32px] cursor-pointer transition-all ${view === 'plan' && selectedIdx === i ? 'text-black font-bold active-dot' : 'text-[#C4C0B8]'}`}>
                                        <span className="text-[9px] mb-0.5">{d.day}</span>
                                        <span className="serif text-xl leading-none">{d.date}</span>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="flex items-center pt-5">
                                <div className="w-[1px] h-7 bg-gray-200 mx-4"></div>
                                <div className="flex gap-4">
                                    <button onClick={() => setView('wallet')} className={`relative flex flex-col items-center gap-0.5 ${view === 'wallet' ? 'text-black font-bold active-dot' : 'text-[#C4C0B8]'}`}>
                                        <i data-lucide="pencil-line" className="w-4 h-4"></i>
                                        <span className="text-[9px] font-bold" style={{writingMode: 'vertical-lr'}}>帳</span>
                                    </button>
                                    <button onClick={() => setView('info')} className={`relative flex flex-col items-center gap-0.5 ${view === 'info' ? 'text-black font-bold active-dot' : 'text-[#C4C0B8]'}`}>
                                        <i data-lucide="info" className="w-4 h-4"></i>
                                        <span className="text-[9px] font-bold" style={{writingMode: 'vertical-lr'}}>訊</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* CONTENT AREA */}
                    <div className="pt-40 pb-32">
                        {view === 'plan' && (
                            <div className="animate-fade">
                                {/* 日期照片 */}
                                <div className="px-5 mt-4 mb-8">
                                    <div className="relative h-56 rounded-3xl overflow-hidden shadow-2xl">
                                        <img src={currentDay.img} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                                        <div className="absolute bottom-6 left-6 right-6">
                                            <div className="flex items-center gap-2 mb-2">
                                                <span className="glass px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest">Day {currentDay.id}</span>
                                                <span className="glass px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest flex items-center gap-1">
                                                    <i data-lucide="map-pin" className="w-2 h-2"></i> {currentDay.city}
                                                </span>
                                            </div>
                                            <h2 className="serif text-2xl text-white font-bold leading-tight tracking-tight">{currentDay.title}</h2>
                                        </div>
                                    </div>
                                </div>

                                {/* 天氣預報區塊 (IMG_5967 比例) */}
                                <div className="px-6 mb-12">
                                    <h3 className="serif text-3xl text-[#C4C0B8] font-bold mb-1 tracking-tight">{currentDay.city}</h3>
                                    <div className="flex justify-between items-center mb-8">
                                        <span className="text-[10px] text-[#D4D0C8] font-medium tracking-wider">未來 24 小時預報</span>
                                        <span className="text-[9px] text-[#E0DDD6] tracking-widest uppercase">Open-Meteo</span>
                                    </div>
                                    <div className="flex overflow-x-auto gap-8 hide-scrollbar py-2">
                                        {["現在", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"].map((t, idx) => (
                                            <div key={idx} className="flex flex-col items-center min-w-[45px] gap-4">
                                                <span className="text-[10px] text-[#D4D0C8] font-medium">{t}</span>
                                                <i data-lucide="sun" className="w-5 h-5 text-[#E0DDD6]"></i>
                                                <span className="serif text-xl text-[#C4C0B8] font-medium">{18 - idx}°</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="divider mx-6 mb-10 opacity-50"></div>

                                {/* 時間軸 */}
                                <div className="px-6 space-y-8 relative before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[0.5px] before:bg-gray-100">
                                    {currentDay.items.map((item) => (
                                        <div key={item.id} onClick={() => setDetailItem(item)} className={`flex gap-6 cursor-pointer group transition-all ${item.highlight ? 'p-5 rounded-2xl ml-[-12px] bg-white border border-transparent shadow-xl ring-1 ring-amber-100' : ''}`}>
                                            <div className={`relative z-10 w-[24px] h-[24px] rounded-full border border-gray-100 bg-white flex items-center justify-center text-[#D4D0C8] shadow-sm group-hover:bg-[#8D2B2B] group-hover:text-white transition-all`}>
                                                <i data-lucide={item.type === 'FLIGHT' ? 'plane' : 'map-pin'} className="w-3.5 h-3.5"></i>
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-[11px] font-bold text-[#D4D0C8] tracking-tighter">{item.time}</span>
                                                    {item.highlight && <span className="text-[8px] bg-amber-50 text-amber-500 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest">Highlight</span>}
                                                </div>
                                                <h3 className="serif text-base font-bold text-[#444] tracking-tight">{item.title}</h3>
                                                <p className="text-xs text-[#D4D0C8] mt-1.5 leading-relaxed opacity-80">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'wallet' && (
                            <div className="animate-fade px-6 py-6">
                                <h2 className="serif text-2xl font-bold mb-6 text-[#444]">旅行帳本</h2>
                                <div className="bg-[#1A1A1A] text-white p-8 rounded-[40px] shadow-2xl mb-8">
                                    <p className="text-[10px] opacity-40 tracking-widest uppercase mb-1">Total Estimated (TWD)</p>
                                    <h3 className="text-4xl font-light tracking-tighter">$ {Math.round(totalTWD).toLocaleString()}</h3>
                                    <p className="text-[9px] opacity-20 italic">Exchange rate: 0.22 (JPY/TWD)</p>
                                </div>
                            </div>
                        )}

                        {view === 'info' && (
                            <div className="animate-fade px-6 py-6">
                                <h2 className="serif text-2xl font-bold mb-8 text-[#444]">實用資訊</h2>
                                <div className="p-6 bg-red-50 rounded-[35px] border border-red-100 mb-6">
                                    <h3 className="serif font-bold text-red-900 mb-4 flex items-center gap-2"><i data-lucide="shield-alert" className="w-4 h-4 text-red-500"></i> 緊急聯絡</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-white p-4 rounded-2xl text-center shadow-sm"><p className="text-[9px] text-red-300 font-bold mb-1">警察</p><p className="serif text-2xl font-bold text-red-700">110</p></div>
                                        <div className="bg-white p-4 rounded-2xl text-center shadow-sm"><p className="text-[9px] text-red-300 font-bold mb-1">救護車</p><p className="serif text-2xl font-bold text-red-700">119</p></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* STATUS BAR (IMG_5967 下方邏輯) */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass rounded-[32px] p-3 border border-white/50 shadow-2xl flex items-center justify-between z-40 lg:max-w-md bg-white/80">
                        <div className="flex items-center gap-3 flex-1">
                            <div onClick={() => setGpsOn(!gpsOn)} className="flex flex-col items-center gap-0.5 border-r border-gray-100 pr-3 cursor-pointer">
                                <div className={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${gpsOn ? 'bg-red-50 text-red-600 animate-pulse' : 'bg-[#FAF9F6] text-[#D4D0C8]'}`}>
                                    <i data-lucide={gpsOn ? 'target' : 'map-pin-off'} className="w-4 h-4"></i>
                                </div>
                                <span className={`text-[7px] font-bold uppercase ${gpsOn ? 'text-red-700' : 'text-[#D4D0C8]'}`}>GPS {gpsOn ? 'ON' : 'OFF'}</span>
                            </div>
                            
                            <div className="flex-1 cursor-pointer" onClick={() => gpsOn ? setIsMoving(!isMoving) : setView('plan')}>
                                {gpsOn ? (
                                    <div>
                                        <div className="flex items-center gap-2 mb-0.5"><span className="serif text-base font-bold text-[#444] tracking-tighter">{isMoving ? '移動中...' : '準備中...'}</span><span className="text-[8px] bg-red-100 px-1.5 py-0.5 rounded text-red-600 font-bold uppercase tracking-widest">Live</span></div>
                                        <p className="text-[9px] text-[#C4C0B8] font-medium truncate w-32 tracking-tight">→ {currentDay.items[0].title}</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex items-center gap-2 mb-0.5 leading-none"><span className="serif text-base font-bold text-[#444] tracking-tighter">13:25</span><span className="text-[8px] bg-[#FAF9F6] px-1.5 py-0.5 rounded text-[#C4C0B8] font-bold uppercase">Next</span></div>
                                        <p className="text-[9px] text-[#C4C0B8] font-medium truncate w-32 tracking-tight">→ {currentDay.items[0].title}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        <div className="bg-[#FAF9F6] rounded-2xl px-4 py-2 text-right border border-[#F2EDE8] min-w-[80px]">
                            {gpsOn ? (
                                <div><i data-lucide="navigation" className="w-3.5 h-3.5 text-red-400 mb-0.5 ml-auto"></i><div className="flex flex-col"><span className="text-[13px] font-bold text-[#444] leading-none tracking-tighter">10,970</span><span className="text-[6px] text-[#C4C0B8] font-bold uppercase tracking-widest">距離目標(M)</span></div></div>
                            ) : (
                                <div><div className="flex items-center justify-end gap-1 mb-0.5 opacity-20"><i data-lucide="clock" className="w-3 h-3 text-[#444]"></i><span className="text-[9px] font-bold text-[#444]">14:00</span></div><span className="text-[7px] text-[#C4C0B8] font-bold uppercase tracking-widest leading-none">Estimate</span></div>
                            )}
                        </div>
                    </div>

                    {/* MODAL: DETAIL */}
                    {detailItem && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade">
                            <div className="bg-white w-full max-w-sm rounded-[45px] overflow-hidden shadow-2xl relative">
                                <button onClick={() => setDetailItem(null)} className="absolute top-6 right-6 p-2.5 bg-[#FAF9F6] rounded-full z-10"><i data-lucide="x" className="w-4 h-4 text-[#C4C0B8]"></i></button>
                                <div className="h-44 bg-[#F2F1ED] flex items-center justify-center text-[#D4D0C8]"><i data-lucide="map-pin" className="w-10 h-10"></i></div>
                                <div className="p-8 pb-12">
                                    <div className="flex items-center gap-2 mb-4">
                                        <span className="text-[10px] font-bold text-[#8D2B2B] bg-red-50 px-2 py-1 rounded tracking-tighter uppercase">{detailItem.time}</span>
                                        <span className="text-[9px] text-[#D4D0C8] font-bold tracking-[0.2em] uppercase">{detailItem.type}</span>
                                    </div>
                                    <h2 className="serif text-2xl font-bold mb-4 text-[#444] leading-tight tracking-tight">{detailItem.title}</h2>
                                    <p className="text-sm text-[#C4C0B8] leading-relaxed mb-10">{detailItem.desc}</p>
                                    <button className="w-full bg-[#333] text-white py-4 rounded-[24px] font-bold text-[11px] active:scale-95 transition-all tracking-widest">GOOGLE MAPS 導航</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
