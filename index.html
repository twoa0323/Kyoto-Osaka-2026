<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Kyoto & Osaka Smart Planner</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { 
            --brand-red: #8D2B2B; 
            --bg-creme: #F2EDE4; 
            --text-dark: #1A1A1A; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-creme); 
            color: var(--text-dark); 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .serif { font-family: 'Noto Serif TC', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .active-dot::after {
            content: ''; position: absolute; bottom: -5px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background-color: var(--brand-red); border-radius: 50%;
        }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .glass-dark { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        
        .highlight-card {
            border: 1px solid transparent;
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(to right, #D4AF37, #F9E29C) border-box;
            box-shadow: 0 4px 20px rgba(141, 43, 43, 0.05);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ICON_MAP = { 'FLIGHT': 'plane', 'TRANSPORT': 'train', 'HOTEL': 'home', 'FOOD': 'utensils', 'SIGHTSEEING': 'camera', 'HIGHLIGHT': 'star', 'INFO': 'info' };

        const INITIAL_PLAN = [
            { id: 1, date: '25', day: 'SAT', title: '抵達京都與鴨川', city: 'Kyoto', defaultImg: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1000', customImg: null, items: [{ id: 101, time: '13:25', title: '出發 (JX846)', desc: '星宇航空 TPE 直飛 KIX', type: 'FLIGHT', location: '關西國際機場', highlight: false, btnLabel: '官方網站', link: 'https://www.starlux-airlines.com' }, { id: 102, time: '16:00', title: '錦市場巡禮', desc: '品嚐豆乳甜甜圈與三木雞卵', type: 'FOOD', location: '錦市場', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 2, date: '26', day: 'SUN', title: '嵐山新綠', city: 'Arashiyama', defaultImg: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?q=80&w=1000', customImg: null, items: [{ id: 201, time: '09:30', title: '嵐山竹林之道', desc: '漫步綠意之道', type: 'SIGHTSEEING', location: '嵐山', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 3, date: '27', day: 'MON', title: '任天堂博物館', city: 'Uji', defaultImg: 'https://images.unsplash.com/photo-1601362840469-51e4d8d59085?q=80&w=1000', customImg: null, items: [{ id: 301, time: '11:00', title: '任天堂博物館', desc: 'Nintendo Museum (預約制)', type: 'HIGHLIGHT', location: 'Nintendo Museum', highlight: true, btnLabel: '官方網站', link: 'https://museum.nintendo.com' }] },
            { id: 4, date: '28', day: 'TUE', title: '清水舞台參拜', city: 'Kyoto', defaultImg: 'https://images.unsplash.com/photo-1528164344705-47542687990d?q=80&w=1000', customImg: null, items: [{ id: 401, time: '08:30', title: '清水寺', desc: '音羽瀑布與產寧坂', type: 'SIGHTSEEING', location: '清水寺', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 5, date: '29', day: 'WED', title: '大阪古今巡禮', city: 'Osaka', defaultImg: 'https://images.unsplash.com/photo-1590253504396-72449038bc4a?q=80&w=1000', customImg: null, items: [{ id: 501, time: '10:00', title: '大阪城公園', desc: '登上天守閣俯瞰市景', type: 'SIGHTSEEING', location: '大阪城', highlight: false, btnLabel: '官方網站', link: '' }] },
            { id: 6, date: '30', day: 'THU', title: '環球影城 USJ', city: 'USJ', defaultImg: 'https://images.unsplash.com/photo-1616422285623-13ff0167c95c?q=80&w=1000', customImg: null, items: [{ id: 601, time: '08:30', title: 'USJ 入園冒險', desc: '瑪利歐與哈利波特全日遊', type: 'HIGHLIGHT', location: '日本環球影城', highlight: true, btnLabel: '官方網站', link: '' }] },
            { id: 7, date: '01', day: 'FRI', title: '勝尾寺祈福', city: 'Minoo', defaultImg: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=1000', customImg: null, items: [{ id: 701, time: '11:00', title: '勝尾寺', desc: '祈求勝運的達摩之寺', type: 'SIGHTSEEING', location: '勝尾寺', highlight: false, btnLabel: '資訊', link: '' }] },
            { id: 8, date: '02', day: 'SAT', title: '返程台北', city: 'Airport', defaultImg: 'https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000', customImg: null, items: [{ id: 801, time: '13:25', title: '回程起飛', desc: '結束愉快 8 天行程', type: 'FLIGHT', location: '關西機場', highlight: false, btnLabel: '資訊', link: '' }] }
        ];

        const INITIAL_INFO = [
          { id: 'map', type: 'MAP', title: 'Google Maps', content: '開啟地圖導航', link: 'Osaka' },
          { id: 'vjw', type: 'VJW', title: 'Visit Japan Web', content: '入境審查 & 海關申報 (請截圖)', link: 'https://www.vjw.digital.go.jp/' },
          { id: 'sos', type: 'EMERGENCY', title: '緊急聯絡 & 支援', content: 'Police 110 / Medical 119', link: '' }
        ];

        const App = () => {
            const load = (k, i) => { const s = localStorage.getItem(k); return s ? JSON.parse(s) : i; };
            const [days, setDays] = useState(() => load('travel_days_v10', INITIAL_PLAN));
            const [expenses, setExpenses] = useState(() => load('exp_v10', []));
            const [infoItems, setInfoItems] = useState(() => load('info_v10', INITIAL_INFO));
            
            const [view, setView] = useState('plan');
            const [selectedIdx, setSelectedIdx] = useState(0);
            const [gpsOn, setGpsOn] = useState(false);
            const [isEditMode, setIsEditMode] = useState(false);
            
            const [editingItem, setEditingItem] = useState(null);
            const [editingExpense, setEditingExpense] = useState(null);
            const [editingInfo, setEditingInfo] = useState(null);
            const [detailItem, setDetailItem] = useState(null);

            const fileRef = useRef(null);
            const coverRef = useRef(null);

            // 持久化資料
            useEffect(() => {
                localStorage.setItem('travel_days_v10', JSON.stringify(days));
                localStorage.setItem('exp_v10', JSON.stringify(expenses));
                localStorage.setItem('info_v10', JSON.stringify(infoItems));
            }, [days, expenses, infoItems]);

            // 圖示渲染：避開 gpsOn 依賴，防止無窮迴圈
            useEffect(() => {
                if (window.lucide) {
                    lucide.createIcons();
                }
            }, [view, isEditMode, editingItem, editingExpense, editingInfo, detailItem]);

            const currentDay = days[selectedIdx] || days[0];
            const firstItem = currentDay?.items?.[0] || { title: '目的地', location: 'Japan' };
            const totalTWD = expenses.reduce((a, c) => a + (c.currency === 'JPY' ? c.amount * 0.22 : c.amount), 0);

            const openMaps = (q) => { 
                if(!q) return;
                const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
                window.open(url, '_blank'); 
            };

            // GPS 切換邏輯優化
            const toggleGps = useCallback(() => {
                setGpsOn(prev => !prev);
            }, []);

            // 監聽 GPS 開啟動作
            useEffect(() => {
                if (gpsOn && firstItem?.location && view === 'plan') {
                    const timer = setTimeout(() => openMaps(firstItem.location), 350);
                    return () => clearTimeout(timer);
                }
            }, [gpsOn]);

            const handleUpload = (e, type) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onloadend = () => {
                    const b64 = reader.result;
                    if (type === 'cover') setDays(days.map((d, i) => i === selectedIdx ? { ...d, customImg: b64 } : d));
                    else if (type === 'item') setEditingItem({ ...editingItem, customImg: b64 });
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen relative lg:shadow-2xl">
                    
                    {/* FIXED HEADER */}
                    <header className="fixed top-0 left-0 right-0 max-w-md mx-auto z-50 bg-[#F2EDE4] pt-8 px-6 pb-2 border-b border-stone-300">
                        <p className="text-[10px] tracking-[0.4em] text-stone-400 uppercase font-bold text-center mb-1">Japan Trip</p>
                        <div className="flex justify-center items-center relative mb-8">
                            <div className="flex items-center gap-2 text-stone-800">
                                <h1 className="serif text-xl font-bold tracking-tight">Kyoto <span className="text-[12px] align-middle text-[#8D2B2B] mx-0.5 opacity-80">●</span> Osaka</h1>
                                <span className="text-[9px] border border-stone-400 rounded-full px-2.5 py-0.5 italic font-medium">2026</span>
                            </div>
                            <div className="absolute right-0 bottom-0 flex gap-5">
                                <button onClick={() => { setView('wallet'); setIsEditMode(false); }} className={`flex flex-col items-center gap-1 transition-all ${view === 'wallet' ? 'text-black font-bold' : 'text-stone-400'}`}><i data-lucide="pencil-line" className="w-4 h-4"></i><span className="text-[9px] font-bold" style={{writingMode: 'vertical-lr'}}>帳本</span></button>
                                <button onClick={() => { setView('info'); setIsEditMode(false); }} className={`flex flex-col items-center gap-1 transition-all ${view === 'info' ? 'text-black font-bold' : 'text-stone-400'}`}><i data-lucide="info" className="w-4 h-4"></i><span className="text-[9px] font-bold" style={{writingMode: 'vertical-lr'}}>資訊</span></button>
                            </div>
                        </div>

                        <div className="flex flex-col -mt-2">
                            <div className="flex overflow-x-auto hide-scrollbar flex gap-8 pt-3 pb-1">
                                {days.map((d, i) => (
                                    <div key={d.id} onClick={() => { setSelectedIdx(i); setView('plan'); }} className={`relative flex flex-col items-center min-w-[32px] cursor-pointer transition-all ${view === 'plan' && selectedIdx === i ? 'text-black font-bold active-dot' : 'text-stone-300'}`}>
                                        <span className="text-[10px] mb-0.5">{d.day}</span>
                                        <span className="serif text-xl leading-none">{d.date}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* CONTENT */}
                    <div className="pt-40 px-6 pb-44">
                        {view === 'plan' && (
                            <div className="animate-fade">
                                <div className="flex justify-between items-center mb-6 px-1">
                                    <h2 className="serif text-xl font-bold text-stone-800 tracking-tight">{currentDay.title}</h2>
                                    <button onClick={() => setIsEditMode(!isEditMode)} className="text-[9px] font-bold text-stone-500 px-3 py-1 rounded-full border border-stone-300 bg-white/50">{isEditMode ? '完成' : '管理'}</button>
                                </div>
                                
                                <div className="relative h-56 rounded-[32px] overflow-hidden shadow-xl mb-12" onClick={() => isEditMode && coverRef.current.click()}>
                                    <img src={currentDay.customImg || currentDay.defaultImg} className="w-full h-full object-cover" />
                                    <input type="file" ref={coverRef} className="hidden" accept="image/*" onChange={(e) => handleUpload(e, 'cover')} />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                                    <div className="absolute bottom-6 left-7 right-7">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="glass-dark px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest">Day {selectedIdx + 1}</span>
                                            <span className="glass-dark px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest flex items-center gap-1"><i data-lucide="map-pin" className="w-2 h-2"></i> {currentDay.city}</span>
                                        </div>
                                        <h2 className="serif text-2xl text-white font-bold leading-tight">{currentDay.title}</h2>
                                    </div>
                                </div>

                                <div className="space-y-10 relative before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[0.5px] before:bg-stone-300">
                                    {currentDay.items.map((item, i) => (
                                        <div key={item.id} className="flex gap-6 items-start">
                                            <div onClick={() => isEditMode ? setEditingItem(item) : setDetailItem(item)} className={`flex-1 flex gap-7 cursor-pointer transition-all ${item.highlight ? 'highlight-card p-6 rounded-2xl ml-[-15px] bg-white' : ''}`}>
                                                <div className={`relative z-10 w-6 h-6 rounded-full border border-stone-200 bg-white flex items-center justify-center text-stone-500 ${item.highlight ? 'bg-[#8D2B2B] text-white shadow-lg border-none' : ''}`}>
                                                    <i data-lucide={ICON_MAP[item.type] || 'map-pin'} className="w-3.5 h-3.5"></i>
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-[11px] font-bold text-stone-500 tracking-tighter">{item.time}</span>
                                                        {isEditMode && <button onClick={(e) => { e.stopPropagation(); const d = [...days]; d[selectedIdx].items = d[selectedIdx].items.filter(it => it.id !== item.id); setDays(d); }} className="text-red-400"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>}
                                                    </div>
                                                    <h3 className="serif text-base font-bold text-stone-800">{item.title}</h3>
                                                    <p className="text-xs text-stone-500 mt-1.5 truncate w-44">{item.desc}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {isEditMode && <button onClick={() => setEditingItem({ title: '', desc: '', time: '09:00', type: 'SIGHTSEEING', highlight: false, btnLabel: '資訊', link: '', customImg: null })} className="w-full py-5 border-2 border-dashed border-stone-300 rounded-[30px] text-stone-500 text-[10px] font-bold uppercase tracking-[0.2em] bg-white/30">+ 新增項目</button>}
                                </div>
                            </div>
                        )}

                        {view === 'wallet' && (
                            <div className="animate-fade">
                                <h2 className="serif text-2xl font-bold mb-6 text-stone-800">旅行帳本</h2>
                                <div className="bg-stone-900 p-10 rounded-[45px] text-white mb-10 shadow-2xl relative overflow-hidden">
                                    <p className="text-[10px] opacity-50 uppercase tracking-[0.3em] mb-2 font-bold">Total Budget TWD</p>
                                    <h3 className="text-4xl font-light tracking-tighter mb-4">${Math.round(totalTWD).toLocaleString()}</h3>
                                </div>
                                <div className="space-y-4">
                                    {expenses.map(e => (
                                        <div key={e.id} onClick={() => setEditingExpense(e)} className="p-6 bg-white rounded-[32px] border border-stone-200 flex justify-between items-center active:scale-[0.98] transition-all">
                                            <div className="flex items-center gap-5">
                                                <div className="w-11 h-11 rounded-full bg-stone-100 flex items-center justify-center text-stone-500"><i data-lucide={ICON_MAP[e.type] || 'receipt-text'} className="w-5 h-5"></i></div>
                                                <div><p className="font-bold text-sm text-stone-800">{e.name}</p><p className="text-[10px] text-stone-400 font-bold">{e.currency === 'JPY' ? `¥${e.amount.toLocaleString()}` : `$${e.amount.toLocaleString()}`}</p></div>
                                            </div>
                                            <p className="font-bold text-stone-900 text-sm">${Math.round(e.currency === 'JPY' ? e.amount * 0.22 : e.amount).toLocaleString()}</p>
                                        </div>
                                    ))}
                                    <button onClick={() => setEditingExpense({ name: '', amount: 0, currency: 'JPY', type: 'FOOD' })} className="w-full py-5 bg-stone-900 text-white rounded-[32px] font-bold text-[10px] uppercase shadow-xl">+ 記一筆支出</button>
                                </div>
                            </div>
                        )}

                        {view === 'info' && (
                            <div className="animate-fade py-2 space-y-8">
                                <h2 className="serif text-2xl font-bold text-stone-800">資訊與支援</h2>
                                <div className="space-y-6">
                                    {infoItems.map((item, idx) => (
                                      <div key={item.id} className="p-7 bg-[#1A1A1A] rounded-[40px] text-white relative active:scale-[0.98]" onClick={() => item.link && window.open(item.link)}>
                                          <h4 className="serif text-xl font-bold text-white mb-1">{item.title}</h4>
                                          <p className="text-[10px] text-stone-400">{item.content}</p>
                                      </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* STATUS BAR - 使用 key 解決核心當機問題 */}
                    {view === 'plan' && (
                        <div key={`status-bar-${gpsOn}`} className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass rounded-[32px] p-3.5 border border-white/60 shadow-2xl flex items-center justify-between z-40 bg-white/80">
                            <div className="flex items-center gap-4 flex-1">
                                <div onClick={toggleGps} className="flex flex-col items-center gap-0.5 border-r border-stone-200 pr-4 cursor-pointer">
                                    <div className={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${gpsOn ? 'bg-red-50 text-red-600 animate-pulse' : 'bg-stone-100 text-stone-400'}`}>
                                        <i data-lucide={gpsOn ? 'target' : 'map-pin-off'} className="w-4 h-4"></i>
                                    </div>
                                    <span className={`text-[7px] font-bold uppercase mt-1 ${gpsOn ? 'text-red-700' : 'text-stone-400'}`}>GPS {gpsOn ? 'ON' : 'OFF'}</span>
                                </div>
                                <div className="flex-1">
                                    <div className="flex items-center gap-2 mb-0.5">
                                        <span className="serif text-base font-bold text-stone-800">
                                            {gpsOn ? 'LIVE TRACK' : (currentDay?.items?.[0]?.time || '13:25')}
                                        </span>
                                        <span className={`text-[7px] px-2 py-0.5 rounded-sm font-bold uppercase ${gpsOn ? 'bg-red-500 text-white' : 'bg-stone-200 text-stone-600'}`}>
                                            {gpsOn ? 'Live' : 'Next'}
                                        </span>
                                    </div>
                                    <p className="text-[9px] text-stone-500 font-bold truncate w-32 tracking-tight">→ {firstItem?.title}</p>
                                </div>
                            </div>
                            <div className="bg-[#F2EDE4] rounded-2xl px-5 py-3 text-right border border-stone-300 min-w-[85px] shadow-inner">
                                <i data-lucide={gpsOn ? "navigation" : "clock"} className={`w-3.5 h-3.5 mb-0.5 ml-auto ${gpsOn ? 'text-brand-red' : 'text-stone-400'}`}></i>
                                <span className="text-[13px] font-bold text-stone-800 tracking-tighter">{gpsOn ? 'Active' : 'Standby'}</span>
                            </div>
                        </div>
                    )}

                    {/* MODAL: DETAIL */}
                    {detailItem && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade">
                            <div className="bg-white w-full max-sm rounded-[45px] overflow-hidden shadow-2xl relative">
                                <button onClick={() => setDetailItem(null)} className="absolute top-6 right-6 p-2 bg-stone-100 rounded-full z-10"><i data-lucide="x" className="w-4 h-4 text-stone-500"></i></button>
                                <div className="h-48 bg-stone-100 flex items-center justify-center">
                                    {detailItem.customImg ? <img src={detailItem.customImg} className="w-full h-full object-cover" /> : <i data-lucide="map-pin" className="w-12 h-12 text-stone-200"></i>}
                                </div>
                                <div className="p-9 pb-12">
                                    <div className="flex items-center gap-2 mb-4">
                                        <span className="text-[10px] font-bold text-white bg-[#8D2B2B] px-2.5 py-1 rounded uppercase">{detailItem.time}</span>
                                    </div>
                                    <h2 className="serif text-2xl font-bold mb-5 text-stone-900 leading-tight">{detailItem.title}</h2>
                                    <button onClick={() => openMaps(detailItem.location)} className="w-full bg-stone-900 text-white py-4.5 rounded-[24px] font-bold text-[11px] flex items-center justify-center gap-2 uppercase tracking-widest active:scale-95 transition-all"><i data-lucide="navigation-2" className="w-4 h-4"></i> Google Maps 導航</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: EDIT ITEM */}
                    {editingItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl animate-fade overflow-y-auto max-h-[90vh]">
                                <h3 className="serif text-xl font-bold mb-6 text-stone-800">編輯行程</h3>
                                <div className="space-y-4">
                                    <div className="h-28 bg-stone-100 rounded-2xl flex flex-col items-center justify-center border border-dashed border-stone-300 relative overflow-hidden" onClick={() => fileRef.current.click()}>
                                        {editingItem.customImg ? <img src={editingItem.customImg} className="w-full h-full object-cover" /> : <div className="text-center"><i data-lucide="image" className="w-5 h-5 text-stone-400 mx-auto"></i><p className="text-[8px] text-stone-500 mt-1 uppercase">更換照片</p></div>}
                                        <input type="file" ref={fileRef} className="hidden" accept="image/*" onChange={(e) => handleUpload(e, 'item')} />
                                    </div>
                                    <div className="flex gap-4">
                                        <div className="flex-1"><label className="text-[10px] text-stone-400 font-bold uppercase mb-1 block">時間</label><input className="w-full p-3 bg-stone-100 rounded-xl text-sm" value={editingItem.time} onChange={e => setEditingItem({...editingItem, time: e.target.value})} /></div>
                                        <div className="w-24">
                                            <label className="text-[10px] text-stone-400 font-bold uppercase mb-1 block">圖示</label>
                                            <select className="w-full p-3 bg-stone-100 rounded-xl text-xs" value={editingItem.type} onChange={e => setEditingItem({...editingItem, type: e.target.value})}>
                                                {Object.keys(ICON_MAP).map(k => <option key={k} value={k}>{k}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div><label className="text-[10px] text-stone-400 font-bold uppercase block mb-1">標題</label><input className="w-full p-3 bg-stone-100 rounded-xl text-sm font-bold" value={editingItem.title} onChange={e => setEditingItem({...editingItem, title: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-stone-400 font-bold uppercase block mb-1">地點 (導航用)</label><input className="w-full p-3 bg-stone-100 rounded-xl text-xs" value={editingItem.location || ''} onChange={e => setEditingItem({...editingItem, location: e.target.value})} /></div>
                                    <div className="pt-4 flex gap-3">
                                        <button onClick={() => {
                                            const d = [...days]; const dy = d[selectedIdx];
                                            if(editingItem.id) dy.items = dy.items.map(i => i.id === editingItem.id ? editingItem : i);
                                            else dy.items.push({...editingItem, id: Date.now()});
                                            setDays(d); setEditingItem(null);
                                        }} className="flex-1 bg-stone-900 text-white py-4.5 rounded-[28px] font-bold text-[10px] uppercase">儲存</button>
                                        <button onClick={() => setEditingItem(null)} className="px-7 py-4.5 border border-stone-200 rounded-[28px] text-stone-400"><i data-lucide="x" className="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: EXPENSE EDIT */}
                    {editingExpense && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-xs rounded-[40px] p-8 shadow-2xl animate-fade">
                                <h3 className="serif text-xl font-bold mb-6 text-stone-800">支出編輯</h3>
                                <div className="space-y-4">
                                    <div><label className="text-[10px] text-stone-400 font-bold uppercase">名稱</label><input className="w-full p-3 bg-stone-100 rounded-xl text-sm font-bold" value={editingExpense.name} onChange={e => setEditingExpense({...editingExpense, name: e.target.value})} /></div>
                                    <div className="flex gap-3">
                                        <div className="flex-1"><label className="text-[10px] text-stone-400 font-bold uppercase">金額</label><input type="number" className="w-full p-3 bg-stone-100 rounded-xl text-base font-bold" value={editingExpense.amount} onChange={e => setEditingExpense({...editingExpense, amount: Number(e.target.value)})} /></div>
                                        <div className="w-20"><label className="text-[10px] text-stone-400 font-bold uppercase">幣別</label><select className="w-full p-3 bg-stone-100 rounded-xl text-xs" value={editingExpense.currency} onChange={e => setEditingExpense({...editingExpense, currency: e.target.value})}><option value="JPY">JPY</option><option value="TWD">TWD</option></select></div>
                                    </div>
                                    <div className="pt-4 flex flex-col gap-2">
                                        <button onClick={() => {
                                            const ne = editingExpense.id ? expenses.map(e => e.id === editingExpense.id ? editingExpense : e) : [...expenses, {...editingExpense, id: Date.now()}];
                                            setExpenses(ne); setEditingExpense(null);
                                        }} className="w-full bg-stone-900 text-white py-4.5 rounded-[28px] font-bold text-[10px] uppercase">儲存</button>
                                        {editingExpense.id && <button onClick={() => { setExpenses(expenses.filter(e => e.id !== editingExpense.id)); setEditingExpense(null); }} className="w-full py-2 text-red-400 text-[9px] font-bold">刪除</button>}
                                        <button onClick={() => setEditingExpense(null)} className="w-full py-2 text-gray-400 text-[9px] font-bold">取消</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
