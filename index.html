<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 Kyoto & Osaka Smart Planner</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --brand-red: #8D2B2B; --bg-creme: #FAF9F6; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-creme); color: #333; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .serif { font-family: 'Noto Serif TC', serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .active-dot::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background-color: var(--brand-red); border-radius: 50%; }
        .glass { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .highlight-card { border: 1px solid transparent; background: linear-gradient(white, white) padding-box, linear-gradient(to right, #D4AF37, #F9E29C) border-box; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_DATA = [
            { id: 1, date: '25', day: 'SAT', title: '抵達京都與鴨川', city: 'Kyoto', img: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1000', items: [
                { id: 101, time: '13:30', title: 'HARUKA 特急', desc: '直達京都車站 (約75分鐘)', type: 'TRANSPORT', highlight: false, location: '京都車站' },
                { id: 102, time: '16:00', title: '錦市場巡禮', desc: '豆乳甜甜圈與三木雞卵', type: 'FOOD', highlight: false, location: '錦市場' },
                { id: 103, time: '17:30', title: '鴨川散步', desc: '欣賞週末傍晚的河岸風光', type: 'SIGHT', highlight: false, location: '鴨川' }
            ]},
            { id: 2, date: '26', day: 'SUN', title: '嵐山新綠與金閣寺', city: 'Arashiyama', img: 'https://images.unsplash.com/photo-1590559899731-a382839e5549?q=80&w=1000', items: [
                { id: 201, time: '09:30', title: '嵐山竹林之道', desc: '野宮神社與天龍寺', type: 'SIGHT', highlight: false, location: '嵐山竹林' },
                { id: 202, time: '15:30', title: '金閣寺', desc: '映照金箔最美時刻', type: 'SIGHT', highlight: false, location: '金閣寺' }
            ]},
            { id: 3, date: '27', day: 'MON', title: '任天堂博物館與宇治', city: 'Uji', img: 'https://images.unsplash.com/photo-1601362840469-51e4d8d59085?q=80&w=1000', items: [
                { id: 301, time: '11:00', title: '任天堂博物館', desc: 'Nintendo Museum (預約制)', type: 'SIGHT', highlight: true, location: 'Nintendo Museum' },
                { id: 302, time: '15:00', title: '宇治平等院', desc: '漫遊宇治與抹茶甜點', type: 'SIGHT', highlight: false, location: '平等院' }
            ]},
            { id: 4, date: '28', day: 'TUE', title: '清水寺與移動至大阪', city: 'Osaka', img: 'https://images.unsplash.com/photo-1528164344705-47542687990d?q=80&w=1000', items: [
                { id: 401, time: '08:30', title: '清水寺', desc: '清水舞台、音羽瀑布', type: 'SIGHT', highlight: false, location: '清水寺' },
                { id: 402, time: '17:00', title: '道頓堀', desc: '與固力果跑跑人合照', type: 'SIGHT', highlight: false, location: '道頓堀' }
            ]},
            { id: 5, date: '29', day: 'WED', title: '大阪古今巡禮', city: 'Osaka', img: 'https://images.unsplash.com/photo-1590253504396-72449038bc4a?q=80&w=1000', items: [
                { id: 501, time: '09:30', title: '大阪城公園', desc: '登頂俯瞰市景', type: 'SIGHT', highlight: false, location: '大阪城' },
                { id: 502, time: '17:30', title: '阿倍野展望台', desc: '夜景百選', type: 'SIGHT', highlight: false, location: '阿倍野 HARUKAS 300' }
            ]},
            { id: 6, date: '30', day: 'THU', title: 'USJ 全日冒險', city: 'USJ', img: 'https://images.unsplash.com/photo-1616422285623-13ff0167c95c?q=80&w=1000', items: [
                { id: 601, time: '08:30', title: 'USJ 入園', desc: '瑪利歐與哈利波特', type: 'SIGHT', highlight: true, location: '日本環球影城' }
            ]},
            { id: 7, date: '01', day: 'FRI', title: '勝尾寺與梅田購物', city: 'Osaka', img: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=1000', items: [
                { id: 701, time: '08:00', title: '木津市場', desc: '海鮮丼與當季水果', type: 'FOOD', highlight: false, location: '木津市場' },
                { id: 702, time: '11:30', title: '勝尾寺', desc: '達摩不倒翁祈福', type: 'SIGHT', highlight: false, location: '勝尾寺' }
            ]},
            { id: 8, date: '02', day: 'SAT', title: '返程台北', city: 'Airport', img: 'https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000', items: [
                { id: 801, time: '10:00', title: '南海電鐵 Rapi:t', desc: '往關西機場', type: 'TRANSPORT', highlight: false, location: '關西機場' }
            ]}
        ];

        const App = () => {
            // 從 LocalStorage 讀取資料
            const loadData = (key, initial) => {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : initial;
            };

            const [days, setDays] = useState(() => loadData('travel_days_v1', INITIAL_DATA));
            const [expenses, setExpenses] = useState(() => loadData('travel_expenses_v1', []));
            const [vjwLink, setVjwLink] = useState(() => loadData('vjw_link', 'https://www.vjw.digital.go.jp/'));
            
            const [view, setView] = useState('plan');
            const [selectedIdx, setSelectedIdx] = useState(0);
            const [gpsOn, setGpsOn] = useState(false);
            const [isMoving, setIsMoving] = useState(false);
            const [isEditMode, setIsEditMode] = useState(false);
            
            const [editingItem, setEditingItem] = useState(null); // 行程編輯 Modal
            const [editingExpense, setEditingExpense] = useState(null); // 帳本編輯 Modal
            const [detailItem, setDetailItem] = useState(null); // 行程詳情 Modal

            // 持久化儲存
            useEffect(() => localStorage.setItem('travel_days_v1', JSON.stringify(days)), [days]);
            useEffect(() => localStorage.setItem('travel_expenses_v1', JSON.stringify(expenses)), [expenses]);
            useEffect(() => localStorage.setItem('vjw_link', JSON.stringify(vjwLink)), [vjwLink]);

            useEffect(() => lucide.createIcons(), [view, selectedIdx, gpsOn, isMoving, editingItem, editingExpense, detailItem, isEditMode]);

            const currentDay = days[selectedIdx];
            const exchangeRate = 0.22;
            const totalTWD = expenses.reduce((acc, curr) => acc + (curr.currency === 'JPY' ? curr.amount * exchangeRate : curr.amount), 0);

            const openGoogleMaps = (query) => {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`, '_blank');
            };

            // --- 行程管理邏輯 ---
            const moveItem = (dayId, itemId, direction) => {
                const newDays = [...days];
                const day = newDays.find(d => d.id === dayId);
                const idx = day.items.findIndex(i => i.id === itemId);
                if (direction === 'up' && idx > 0) {
                    [day.items[idx], day.items[idx - 1]] = [day.items[idx - 1], day.items[idx]];
                } else if (direction === 'down' && idx < day.items.length - 1) {
                    [day.items[idx], day.items[idx + 1]] = [day.items[idx + 1], day.items[idx]];
                }
                setDays(newDays);
            };

            const deleteItem = (dayId, itemId) => {
                const newDays = [...days];
                const day = newDays.find(d => d.id === dayId);
                day.items = day.items.filter(i => i.id !== itemId);
                setDays(newDays);
            };

            const saveItineraryItem = (updatedItem) => {
                const newDays = [...days];
                const day = newDays.find(d => d.id === currentDay.id);
                if (updatedItem.id && day.items.find(i => i.id === updatedItem.id)) {
                    day.items = day.items.map(i => i.id === updatedItem.id ? updatedItem : i);
                } else {
                    day.items.push({ ...updatedItem, id: Date.now() });
                }
                setDays(newDays);
                setEditingItem(null);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen relative bg-white lg:shadow-2xl">
                    
                    {/* HEADER */}
                    <header className="fixed top-0 left-0 right-0 max-w-md mx-auto z-50 bg-[#FAF9F6] pt-8 px-6 border-b border-gray-100">
                        <p className="text-[10px] tracking-[0.4em] text-[#C4C0B8] uppercase font-bold text-center mb-1">Japan Trip</p>
                        <div className="flex justify-center items-center relative mb-10">
                            <div className="flex items-center gap-2">
                                <h1 className="serif text-xl font-bold tracking-tight text-[#444]">Kyoto & Osaka</h1>
                                <span className="text-[9px] border border-gray-300 rounded-full px-2 py-0.5 text-gray-400 italic">2026</span>
                            </div>
                            <div className="absolute right-0 bottom-0 flex gap-5">
                                <button onClick={() => { setView('wallet'); setIsEditMode(false); }} className={`flex flex-col items-center gap-1 ${view === 'wallet' ? 'text-black' : 'text-gray-300'}`}>
                                    <i data-lucide="pencil-line" className="w-4 h-4"></i>
                                    <span className="text-[9px] font-bold" style={{writingMode: 'vertical-lr'}}>帳本</span>
                                </button>
                                <button onClick={() => { setView('info'); setIsEditMode(false); }} className={`flex flex-col items-center gap-1 ${view === 'info' ? 'text-black' : 'text-gray-300'}`}>
                                    <i data-lucide="info" className="w-4 h-4"></i>
                                    <span className="text-[9px] font-bold" style={{writingMode: 'vertical-lr'}}>資訊</span>
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center">
                            <div className="absolute top-[82px] left-6 text-[9px] tracking-widest text-[#C4C0B8] font-bold uppercase">Apr 25 - May 2</div>
                            <div className="flex-1 overflow-x-auto hide-scrollbar flex gap-8 pt-5 pb-2">
                                {days.map((d, i) => (
                                    <div key={d.id} onClick={() => { setSelectedIdx(i); setView('plan'); }} className={`relative flex flex-col items-center min-w-[32px] cursor-pointer transition-all ${view === 'plan' && selectedIdx === i ? 'text-black font-bold active-dot' : 'text-[#C4C0B8]'}`}>
                                        <span className="text-[10px] mb-1">{d.day}</span>
                                        <span className="serif text-xl leading-none">{d.date}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* CONTENT */}
                    <div className="pt-44 px-6 pb-40">
                        {view === 'plan' && (
                            <div className="animate-fade">
                                <div className="flex justify-between items-center mb-6 px-1">
                                    <h2 className="serif text-xl font-bold text-[#444] tracking-tight">{currentDay.title}</h2>
                                    <button onClick={() => setIsEditMode(!isEditMode)} className={`text-[9px] font-bold px-3 py-1 rounded-full border transition-all ${isEditMode ? 'bg-[#8D2B2B] text-white border-transparent shadow-lg' : 'text-gray-300 border-gray-100'}`}>
                                        {isEditMode ? '完成管理' : '管理行程'}
                                    </button>
                                </div>
                                
                                {/* Photo Area */}
                                <div className="relative h-56 rounded-3xl overflow-hidden shadow-2xl mb-10">
                                    <img src={currentDay.img} className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                                    <div className="absolute bottom-6 left-6 right-6">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="glass px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest">Day {selectedIdx + 1}</span>
                                            <span className="glass px-2.5 py-0.5 rounded text-[8px] font-bold text-white uppercase tracking-widest flex items-center gap-1">
                                                <i data-lucide="map-pin" className="w-2 h-2"></i> {currentDay.city}
                                            </span>
                                        </div>
                                        <h2 className="serif text-2xl text-white font-bold leading-tight tracking-tight">{currentDay.title}</h2>
                                    </div>
                                </div>

                                {/* Weather Area */}
                                <div className="mb-10 px-1">
                                    <h3 className="serif text-3xl text-[#C4C0B8] font-bold mb-1">{currentDay.city}</h3>
                                    <div className="flex justify-between items-center mb-6">
                                        <span className="text-[10px] text-[#D4D0C8] font-medium tracking-wider">未來 24 小時預報</span>
                                        <span className="text-[9px] text-[#E0DDD6] tracking-widest">Open-Meteo</span>
                                    </div>
                                    <div className="flex overflow-x-auto gap-8 hide-scrollbar">
                                        {["現在", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"].map((t, idx) => (
                                            <div key={idx} className="flex flex-col items-center min-w-[42px] gap-4">
                                                <span className="text-[10px] text-[#D4D0C8] font-medium">{t}</span>
                                                <i data-lucide="sun" className="w-4 h-4 text-[#E0DDD6]"></i>
                                                <span className="serif text-xl text-[#C4C0B8] font-medium">{18 - idx}°</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="h-[1px] bg-[#EFEBE4] mb-8"></div>

                                {/* Itinerary Timeline */}
                                <div className="space-y-8 relative before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[0.5px] before:bg-gray-100">
                                    {currentDay.items.map((item) => (
                                        <div key={item.id} className={`flex gap-6 items-start transition-all ${isEditMode ? 'opacity-90' : ''}`}>
                                            {isEditMode && (
                                                <div className="flex flex-col gap-2 pt-1">
                                                    <button onClick={() => moveItem(currentDay.id, item.id, 'up')} className="text-gray-300 hover:text-black"><i data-lucide="chevron-up" className="w-4 h-4"></i></button>
                                                    <button onClick={() => moveItem(currentDay.id, item.id, 'down')} className="text-gray-300 hover:text-black"><i data-lucide="chevron-down" className="w-4 h-4"></i></button>
                                                </div>
                                            )}
                                            
                                            <div onClick={() => isEditMode ? setEditingItem(item) : setDetailItem(item)} className={`flex-1 flex gap-6 cursor-pointer group ${item.highlight ? 'highlight-card p-5 rounded-2xl ml-[-12px] bg-white' : ''}`}>
                                                <div className={`relative z-10 w-6 h-6 rounded-full border border-gray-100 bg-white flex items-center justify-center text-[#D4D0C8] ${item.highlight ? 'bg-[#8D2B2B] text-white shadow-lg' : ''}`}>
                                                    <i data-lucide={item.type === 'FLIGHT' ? 'plane' : 'map-pin'} className="w-3.5 h-3.5"></i>
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-start">
                                                        <span className="text-[11px] font-bold text-[#D4D0C8] tracking-tighter">{item.time}</span>
                                                        {isEditMode && <button onClick={(e) => { e.stopPropagation(); deleteItem(currentDay.id, item.id); }} className="text-red-300"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>}
                                                    </div>
                                                    <h3 className="serif text-base font-bold text-[#444] tracking-tight">{item.title}</h3>
                                                    <p className="text-xs text-[#D4D0C8] mt-1.5 leading-relaxed">{item.desc}</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    {isEditMode && (
                                        <button onClick={() => setEditingItem({ title: '', desc: '', time: '09:00', type: 'SIGHT', location: '', highlight: false })} className="w-full py-4 border-2 border-dashed border-gray-100 rounded-3xl text-[#C4C0B8] text-[10px] font-bold uppercase tracking-widest hover:border-gray-300 hover:text-gray-400 transition-all">
                                            + 新增排程項目
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'wallet' && (
                            <div className="animate-fade">
                                <div className="bg-[#121212] p-8 rounded-[40px] text-white mb-8 shadow-2xl relative overflow-hidden">
                                    <p className="text-[10px] opacity-40 uppercase tracking-widest mb-1">Estimated Total (TWD)</p>
                                    <h3 className="text-4xl font-light tracking-tighter mb-4">${Math.round(totalTWD).toLocaleString()}</h3>
                                    <p className="text-[9px] opacity-20 italic">Rate: 0.22 (JPY/TWD)</p>
                                </div>
                                <div className="space-y-3">
                                    {expenses.map(e => (
                                        <div key={e.id} onClick={() => setEditingExpense(e)} className="p-5 bg-white rounded-3xl border border-gray-100 flex justify-between items-center shadow-sm cursor-pointer active:scale-95 transition-all">
                                            <div className="flex items-center gap-4">
                                                <div className="w-10 h-10 rounded-full bg-stone-50 flex items-center justify-center text-stone-300"><i data-lucide="receipt-text" className="w-5 h-5"></i></div>
                                                <div><p className="font-bold text-sm tracking-tight">{e.name}</p><p className="text-[10px] text-gray-400">{e.currency === 'JPY' ? `¥${e.amount.toLocaleString()}` : `$${e.amount.toLocaleString()}`}</p></div>
                                            </div>
                                            <p className="font-bold text-gray-800 text-sm">${(e.currency === 'JPY' ? Math.round(e.amount * exchangeRate) : e.amount).toLocaleString()}</p>
                                        </div>
                                    ))}
                                    <button onClick={() => setEditingExpense({ name: '', amount: 0, currency: 'JPY' })} className="w-full py-5 bg-black text-white rounded-[28px] font-bold text-[10px] shadow-xl tracking-[0.2em]">+ 記一筆支出</button>
                                </div>
                            </div>
                        )}

                        {view === 'info' && (
                            <div className="animate-fade space-y-6">
                                <div onClick={() => openGoogleMaps('大阪')} className="p-6 bg-stone-900 rounded-[35px] text-white flex items-center justify-between cursor-pointer active:scale-95 transition-all">
                                    <div className="flex items-center gap-3"><i data-lucide="map" className="w-5 h-5 text-blue-400"></i><span className="text-sm font-bold tracking-widest uppercase">Google Maps</span></div>
                                    <i data-lucide="external-link" className="w-4 h-4 opacity-30"></i>
                                </div>
                                <div className="p-6 bg-white border border-gray-100 rounded-[35px] shadow-sm">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="flex items-center gap-3"><i data-lucide="qr-code" className="w-5 h-5 text-pink-400"></i><span className="text-sm font-bold text-gray-600">Visit Japan Web</span></div>
                                        <button onClick={() => {
                                            const newLink = prompt('請輸入 VJW 網址：', vjwLink);
                                            if(newLink) setVjwLink(newLink);
                                        }} className="text-red-400"><i data-lucide="edit-3" className="w-4 h-4"></i></button>
                                    </div>
                                    <p className="text-[9px] text-gray-300 truncate font-mono">{vjwLink}</p>
                                    <button onClick={() => window.open(vjwLink)} className="w-full mt-4 bg-gray-50 py-3 rounded-2xl text-[9px] font-bold text-gray-400 uppercase tracking-widest">點擊開啟內容</button>
                                </div>
                                <div className="p-6 bg-red-50 rounded-[35px] border border-red-100">
                                    <h3 className="serif font-bold text-red-900 mb-4 flex items-center gap-2"><i data-lucide="shield-alert" className="w-4 h-4 text-red-500"></i> 緊急聯絡</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-white p-4 rounded-2xl text-center shadow-sm"><p className="text-[10px] text-red-300 font-bold mb-1 uppercase tracking-widest">Police</p><p className="serif text-2xl font-bold text-red-700">110</p></div>
                                        <div className="bg-white p-4 rounded-2xl text-center shadow-sm"><p className="text-[10px] text-red-300 font-bold mb-1 uppercase tracking-widest">Emergency</p><p className="serif text-2xl font-bold text-red-700">119</p></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* STATUS BAR */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass rounded-[32px] p-3 border border-white/50 shadow-2xl flex items-center justify-between z-40 lg:max-w-md bg-white/80">
                        <div className="flex items-center gap-3 flex-1">
                            <div onClick={() => setGpsOn(!gpsOn)} className="flex flex-col items-center gap-0.5 border-r border-gray-100 pr-3 cursor-pointer">
                                <div className={`w-9 h-9 rounded-full flex items-center justify-center transition-all ${gpsOn ? 'bg-red-50 text-red-600 animate-pulse' : 'bg-[#FAF9F6] text-[#D4D0C8]'}`}>
                                    <i data-lucide={gpsOn ? 'target' : 'map-pin-off'} className="w-4 h-4"></i>
                                </div>
                                <span className={`text-[7px] font-bold uppercase ${gpsOn ? 'text-red-700' : 'text-[#D4D0C8]'}`}>GPS {gpsOn ? 'ON' : 'OFF'}</span>
                            </div>
                            <div className="flex-1 cursor-pointer" onClick={() => gpsOn ? setIsMoving(!isMoving) : setView('plan')}>
                                {gpsOn ? (
                                    <div onClick={() => openGoogleMaps(currentDay.items[0]?.location || 'Kyoto')}>
                                        <div className="flex items-center gap-2 mb-0.5"><span className="serif text-base font-bold text-[#444] tracking-tighter">{isMoving ? '移動中...' : '準備中...'}</span><span className="text-[7px] bg-red-100 px-1.5 py-0.5 rounded text-red-600 font-bold uppercase">Navi</span></div>
                                        <p className="text-[9px] text-[#C4C0B8] font-medium truncate w-32 tracking-tight">→ {currentDay.items[0]?.title || '下一個目的地'}</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="flex items-center gap-2 mb-0.5 leading-none"><span className="serif text-base font-bold text-[#444] tracking-tighter">13:25</span><span className="text-[8px] bg-[#FAF9F6] px-1.5 py-0.5 rounded text-[#C4C0B8] font-bold uppercase tracking-widest">Next</span></div>
                                        <p className="text-[9px] text-[#C4C0B8] font-medium truncate w-32 tracking-tight">→ {currentDay.items[0]?.title || '休息中'}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="bg-[#FAF9F6] rounded-2xl px-4 py-2 text-right border border-[#F2EDE8] min-w-[80px]">
                            {gpsOn ? (
                                <div onClick={() => openGoogleMaps(currentDay.items[0]?.location || 'Kyoto')} className="cursor-pointer">
                                    <i data-lucide="navigation" className="w-3.5 h-3.5 text-red-400 mb-0.5 ml-auto"></i>
                                    <div className="flex flex-col"><span className="text-[13px] font-bold text-[#444] leading-none tracking-tighter">10,970</span><span className="text-[6px] text-[#C4C0B8] font-bold uppercase tracking-widest">距離目標(M)</span></div>
                                </div>
                            ) : (
                                <div><div className="flex items-center justify-end gap-1 mb-0.5 opacity-20"><i data-lucide="clock" className="w-3 h-3 text-[#444]"></i><span className="text-[9px] font-bold text-[#444]">14:00</span></div><span className="text-[7px] text-[#C4C0B8] font-bold uppercase tracking-widest leading-none">Estimate</span></div>
                            )}
                        </div>
                    </div>

                    {/* MODAL: ITEM DETAIL */}
                    {detailItem && !isEditMode && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade">
                            <div className="bg-white w-full max-w-sm rounded-[45px] overflow-hidden shadow-2xl relative">
                                <button onClick={() => setDetailItem(null)} className="absolute top-6 right-6 p-2.5 bg-[#FAF9F6] rounded-full z-10"><i data-lucide="x" className="w-4 h-4 text-[#C4C0B8]"></i></button>
                                <div className="h-44 bg-[#F2F1ED] flex items-center justify-center text-[#D4D0C8]"><i data-lucide="map-pin" className="w-10 h-10"></i></div>
                                <div className="p-8 pb-12">
                                    <div className="flex items-center gap-2 mb-4">
                                        <span className="text-[10px] font-bold text-[#8D2B2B] bg-red-50 px-2 py-1 rounded tracking-tighter uppercase">{detailItem.time}</span>
                                        <span className="text-[9px] text-[#D4D0C8] font-bold tracking-[0.2em] uppercase">{detailItem.type}</span>
                                    </div>
                                    <h2 className="serif text-2xl font-bold mb-4 text-[#444] leading-tight tracking-tight">{detailItem.title}</h2>
                                    <p className="text-sm text-[#C4C0B8] leading-relaxed mb-10">{detailItem.desc}</p>
                                    <div className="flex flex-col gap-3">
                                        <button onClick={() => openGoogleMaps(detailItem.location)} className="w-full bg-[#333] text-white py-4 rounded-[24px] font-bold text-[11px] flex items-center justify-center gap-2 active:scale-95 transition-all tracking-widest"><i data-lucide="navigation-2" className="w-4 h-4"></i> GOOGLE MAPS 導航</button>
                                        <button className="w-full border border-gray-100 text-gray-400 py-4 rounded-[24px] font-bold text-[11px] active:scale-95 transition-all tracking-widest">官方網站</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: EDIT ITEM (管理行程用) */}
                    {editingItem && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl animate-fade overflow-y-auto max-h-[90vh]">
                                <h3 className="serif text-xl font-bold mb-6 text-[#444]">編輯排程</h3>
                                <div className="space-y-4">
                                    <div><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">時間</label><input type="text" className="w-full p-3 bg-gray-50 rounded-xl outline-none text-sm" value={editingItem.time} onChange={e => setEditingItem({...editingItem, time: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">標題</label><input type="text" className="w-full p-3 bg-gray-50 rounded-xl outline-none text-sm" value={editingItem.title} onChange={e => setEditingItem({...editingItem, title: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">內容介紹</label><textarea className="w-full p-3 bg-gray-50 rounded-xl outline-none text-sm h-24" value={editingItem.desc} onChange={e => setEditingItem({...editingItem, desc: e.target.value})} /></div>
                                    <div><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">搜尋地點 (Maps)</label><input type="text" className="w-full p-3 bg-gray-50 rounded-xl outline-none text-sm" value={editingItem.location} onChange={e => setEditingItem({...editingItem, location: e.target.value})} /></div>
                                    <div className="flex items-center justify-between p-3 bg-amber-50 rounded-xl">
                                        <span className="text-[10px] font-bold text-amber-600">重點 Highlight (金邊)</span>
                                        <input type="checkbox" checked={editingItem.highlight} onChange={e => setEditingItem({...editingItem, highlight: e.target.checked})} />
                                    </div>
                                    <div className="pt-4 flex gap-2">
                                        <button onClick={() => saveItineraryItem(editingItem)} className="flex-1 bg-black text-white py-4 rounded-[28px] font-bold text-[10px] tracking-widest uppercase">儲存變更</button>
                                        <button onClick={() => setEditingItem(null)} className="px-6 py-4 border border-gray-100 rounded-[28px] text-gray-300"><i data-lucide="x" className="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: EXPENSE EDIT */}
                    {editingExpense && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/70 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-xs rounded-[40px] p-8 shadow-2xl animate-fade">
                                <h3 className="serif text-xl font-bold mb-6 text-[#444]">支出明細</h3>
                                <div className="space-y-4">
                                    <div><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">項目名稱</label><input type="text" className="w-full p-3 bg-gray-50 rounded-xl outline-none text-sm" value={editingExpense.name} onChange={e => setEditingExpense({...editingExpense, name: e.target.value})} /></div>
                                    <div className="flex gap-4">
                                        <div className="flex-1"><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">金額</label><input type="number" className="w-full p-3 bg-gray-50 rounded-xl outline-none text-base font-bold" value={editingExpense.amount} onChange={e => setEditingExpense({...editingExpense, amount: Number(e.target.value)})} /></div>
                                        <div className="w-20"><label className="text-[10px] text-gray-400 font-bold uppercase tracking-widest">幣別</label><select className="w-full p-3 bg-gray-50 rounded-xl outline-none text-xs font-bold" value={editingExpense.currency} onChange={e => setEditingExpense({...editingExpense, currency: e.target.value})}><option value="JPY">JPY</option><option value="TWD">TWD</option></select></div>
                                    </div>
                                    <div className="pt-4 flex flex-col gap-2">
                                        <button onClick={() => { saveExpense(editingExpense); setEditingExpense(null); }} className="w-full bg-black text-white py-4 rounded-[28px] font-bold text-[10px] tracking-widest uppercase">確認儲存</button>
                                        {editingExpense.id && <button onClick={() => deleteExpense(editingExpense.id)} className="w-full py-2 text-red-400 text-[9px] font-bold uppercase">刪除此筆記錄</button>}
                                        <button onClick={() => setEditingExpense(null)} className="w-full py-2 text-gray-300 text-[9px] font-bold uppercase tracking-widest">取消</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
